<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101826"><link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PC Speaker"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/style.css"><title>PC Speaker</title></head><body><main>
<h1>PC Speaker</h1><p>Enter the 6-digit code shown on your PC.</p>
<input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" autocomplete="off">
<button id="go">Start listening</button>
<div class="status" id="status"><span class="dot"></span><span id="msg">Not connected</span></div>
<small>Use the volume buttons on your iPhone to change the volume.</small>
<audio id="player" playsinline></audio>
</main>
<script src="/lib/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const setStatus = (t, c = '') => { $('msg').textContent = t; $('status').className = 'status ' + c; };
const stereo = sdp => sdp.replace('useinbandfec=1', 'useinbandfec=1;stereo=1;sprop-stereo=1;maxaveragebitrate=192000');
const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
const TARGET_MS = 20;   // playback buffer; raise to 50-100 if audio crackles

const audio = $('player');
let peer, wake;

$('code').value = localStorage.getItem('code') || '';

async function keepAwake() { try { wake = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && peer) keepAwake(); });
document.body.addEventListener('click', () => { if (audio.srcObject && audio.paused) audio.play().catch(() => {}); });

function lowLatency(call) {
  try {
    call.peerConnection.getReceivers().forEach(r => {
      if ('jitterBufferTarget' in r) r.jitterBufferTarget = TARGET_MS;
      if ('playoutDelayHint' in r) r.playoutDelayHint = TARGET_MS / 1000;
    });
  } catch (e) {}
}

$('go').onclick = () => {
  const code = $('code').value.trim();
  if (!/^\d{6}$/.test(code)) return setStatus('Enter the 6-digit code from your PC.', 'bad');
  localStorage.setItem('code', code);

  // Unlock audio playback inside this tap (iOS requirement)
  audio.src = SILENT; audio.play().catch(() => {});
  keepAwake();

  $('go').disabled = true; setStatus('Connecting…');
  if (peer) peer.destroy();
  peer = new Peer();
  peer.on('open', () => {
    const conn = peer.connect('pcspk-' + code, { reliable: true });
    conn.on('open', () => setStatus('Connected. Waiting for the PC to share audio…', 'ok'));
    conn.on('close', () => { setStatus('PC disconnected.', 'bad'); $('go').disabled = false; });
  });
  peer.on('call', call => {
    call.answer(undefined, { sdpTransform: stereo });
    call.on('stream', s => {
      audio.srcObject = s;
      audio.play().then(() => setStatus('Playing PC audio', 'ok'))
                  .catch(() => setStatus('Tap anywhere to start playing.', 'bad'));
      lowLatency(call);
      if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: 'PC audio', artist: 'PC Speaker' });
    });
    call.on('close', () => setStatus('Stream ended.', 'bad'));
  });
  peer.on('disconnected', () => peer.reconnect());
  peer.on('error', e => {
    setStatus(e.type === 'peer-unavailable' ? 'Code not found. Is the PC page open?' : 'Error: ' + e.type, 'bad');
    $('go').disabled = false;
  });
};

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
</script></body></html>
