<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101826"><link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PC Speaker"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/style.css">
<title>PC Speaker</title>
<style>
  [hidden]{display:none!important}
  .pill{display:inline-block;padding:6px 16px;border-radius:99px;font-size:14px;font-weight:600;background:#2b3a57;color:var(--mut)}
  .pill.ok{background:rgba(79,209,197,.18);color:var(--acc)}
  .pill.bad{background:rgba(255,123,123,.18);color:var(--bad)}
  .audio-indicator{height:112px;margin:18px 0 4px;display:flex;justify-content:center;align-items:center;gap:7px}
  .audio-indicator i{display:block;width:8px;height:20px;border-radius:99px;background:var(--mut);transform:scaleY(.45);animation:sync-bounce .85s ease-in-out infinite alternate;animation-play-state:paused}
  .audio-indicator i:nth-child(2){animation-delay:-.22s}
  .audio-indicator i:nth-child(3){animation-delay:-.48s}
  .audio-indicator i:nth-child(4){animation-delay:-.12s}
  .audio-indicator i:nth-child(5){animation-delay:-.36s}
  .audio-indicator.active i{background:var(--acc);animation-play-state:running}
  .audio-indicator.good i{background:var(--amber)}
  .audio-indicator.low i{background:var(--bad)}
  .audio-indicator.idle i{opacity:.55}
  @keyframes sync-bounce{from{transform:scaleY(.45)}to{transform:scaleY(1.7)}}
  @media (prefers-reduced-motion:reduce){.audio-indicator i{animation:none;transform:none}}
  #verdict{margin:0 0 20px;min-height:24px}
  button.ghost{background:transparent;color:var(--fg);border:2px solid #2b3a57}
  #scan{display:flex;align-items:center;justify-content:center;gap:8px}
  .camera-icon{width:20px;height:20px}
  #scanner:not([hidden]){margin-top:14px}
  #scanner-video{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#000;border-radius:12px}
  #scan-msg{margin-bottom:10px}
  .delay-panel{margin-top:18px;text-align:left}
  .delay-panel>span{display:block;margin-bottom:8px;color:var(--mut);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
  .delay-presets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .delay-presets button{min-height:48px;margin:0;padding:10px 4px;font-size:14px;border:2px solid #2b3a57;background:transparent;color:var(--fg)}
  .delay-presets button.active{background:var(--acc);border-color:var(--acc);color:#08202a}
  .delay-descriptions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .delay-descriptions span{color:var(--mut);font-size:12px;line-height:1.35}
  .setup-divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--mut);font-size:12px}
  .setup-divider::before,.setup-divider::after{content:"";height:1px;background:var(--line);flex:1}
  #code-hint{min-height:18px;margin:8px 0 0;font-size:13px}
</style></head><body><main>

<!-- SCREEN 1: enter code -->
<section id="setup">
  <h1>PC Speaker</h1><p>Enter the 6-digit code shown on your PC.</p>
  <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" autocomplete="off" aria-describedby="code-hint">
  <p id="code-hint" role="status" aria-live="polite"></p>
  <button id="scan" class="ghost" type="button" aria-label="Scan QR code with camera">
    <svg class="camera-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M4 7h3l2-3h6l2 3h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/>
      <circle cx="12" cy="13" r="4"/>
    </svg>
    Scan QR code
  </button>
  <div id="scanner" hidden>
    <video id="scanner-video" playsinline></video>
    <p id="scan-msg" aria-live="polite">Point your camera at the QR code on your PC.</p>
    <button id="close-scan" class="ghost" type="button">Cancel scan</button>
  </div>
  <div class="setup-divider">or enter manually</div>
  <button id="go">Start listening</button>
  <div class="status" id="status" role="status" aria-live="polite"><span class="dot"></span><span id="msg">Not connected</span></div>
  <small>Use the volume buttons on your iPhone to change the volume.</small>
</section>

<!-- SCREEN 2: connected -->
<section id="live" hidden>
  <span class="pill" id="pill" role="status" aria-live="polite">Connecting…</span>
  <div class="audio-indicator idle" id="sync-indicator" aria-hidden="true">
    <i></i><i></i><i></i><i></i><i></i>
  </div>
  <p id="verdict" role="status" aria-live="polite">Waiting for audio…</p>
  <div class="delay-panel" role="group" aria-label="Audio delay presets">
    <span>Delay preset</span>
    <div class="delay-presets">
      <button type="button" data-delay="20">Balanced</button>
      <button type="button" data-delay="100">Stable</button>
    </div>
    <div class="delay-descriptions" aria-hidden="true">
      <span>Lower delay · may crackle</span>
      <span>More stable · more delay</span>
    </div>
  </div>
  <button id="reconnect" class="ghost" hidden>Reconnect</button>
  <button id="stop" class="ghost">Disconnect</button>
</section>

<audio id="player" playsinline></audio>
</main>
<script src="/lib/peerjs.min.js"></script>
<script src="/lib/qr-scanner.umd.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const stereo = sdp => sdp.replace('useinbandfec=1', 'useinbandfec=1;stereo=1;sprop-stereo=1;maxaveragebitrate=192000');
const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
const EXTRA_MS  = 40;   // rough guess for PC capture + phone output; set 0 to show only measured delay
const EXCELLENT_MS = 80, GOOD_MS = 100;

function getDeviceId() {
  const key = 'pcspk-device-id';
  const saved = localStorage.getItem(key);
  if (/^[a-f0-9]{32}$/.test(saved || '')) return saved;
  const bytes = crypto.getRandomValues(new Uint8Array(16));
  const id = Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
  localStorage.setItem(key, id);
  return id;
}

function getDeviceLabel() {
  const ua = navigator.userAgent;
  if (/iPhone|iPod/i.test(ua)) return 'iPhone';
  if (/iPad/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return 'iPad';
  if (/Android/i.test(ua)) return 'Android';
  return 'Mobile device';
}

const deviceId = getDeviceId();
const deviceLabel = getDeviceLabel();
const audio = $('player');
let peer, call, wake, timer, prev = null, hist = [];
let qrScanner;
let connectionAttempt = 0;
const savedDelay = Number(localStorage.getItem('pcspk-delay-ms'));
let targetMs = [20, 100].includes(savedDelay) ? savedDelay : 20;

$('code').value = localStorage.getItem('code') || '';

// A QR link opened by the iPhone camera can connect immediately.
const qrCode = new URLSearchParams(location.search).get('code');
if (/^\d{6}$/.test(qrCode || '')) {
  $('code').value = qrCode;
  localStorage.setItem('code', qrCode);
  history.replaceState(null, '', '/receive');
}

function show(view) { $('setup').hidden = view !== 'setup'; $('live').hidden = view !== 'live'; }
function setSetupStatus(t, c = '') { $('msg').textContent = t; $('status').className = 'status ' + c; }
function setPill(t, c = '') { $('pill').textContent = t; $('pill').className = 'pill ' + c; }

function latencyQuality(ms) {
  if (ms < EXCELLENT_MS) return 'excellent';
  if (ms <= GOOD_MS) return 'good';
  return 'low';
}

function handleScan(result) {
  let scanned;
  try {
    scanned = new URL(result.data, location.origin);
  } catch {
    $('scan-msg').textContent = 'That QR code is not a valid PC Speaker link. Keep scanning or enter the code manually.';
    return;
  }
  const code = scanned.searchParams.get('code');
  if (scanned.origin !== location.origin || scanned.pathname !== '/receive' || !/^\d{6}$/.test(code || '')) {
    $('scan-msg').textContent = 'That QR code is not for this receiver. Keep scanning or enter the code manually.';
    return;
  }

  qrScanner.stop();
  $('scanner').hidden = true;
  $('code').value = code;
  localStorage.setItem('code', code);
  history.replaceState(null, '', '/receive');
  startListening(code, false);
}

async function openScanner() {
  $('scanner').hidden = false;
  $('scan-msg').textContent = 'Point your camera at the QR code on your PC.';
  unlockAudio();
  if (!qrScanner) {
    qrScanner = new QrScanner($('scanner-video'), handleScan, {
      returnDetailedScanResult: true,
      preferredCamera: 'environment'
    });
  }
  try {
    await qrScanner.start();
  } catch (error) {
    const reason = error instanceof Error ? error.message : String(error);
    $('scan-msg').textContent = 'Camera unavailable: ' + reason + '. Allow camera access, or enter the code manually.';
    setSetupStatus('Could not start the camera.', 'bad');
  }
}

function closeScanner() {
  if (qrScanner) qrScanner.stop();
  $('scanner').hidden = true;
}

$('scan').onclick = openScanner;
$('close-scan').onclick = closeScanner;

function resetStats() {
  prev = null; hist = [];
  $('sync-indicator').className = 'audio-indicator idle';
  $('verdict').textContent = 'Waiting for audio…';
}

async function keepAwake() { try { wake = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && peer) keepAwake(); });
document.body.addEventListener('click', () => {
  if (audio.srcObject && audio.paused)
    audio.play().then(() => setPill('Connected - playing', 'ok'))
                .catch(() => setPill('Tap the screen to start', 'bad'));
});

function lowLatency(c) {
  try {
    c.peerConnection.getReceivers().forEach(r => {
      if ('jitterBufferTarget' in r) r.jitterBufferTarget = targetMs;
      if ('playoutDelayHint' in r) r.playoutDelayHint = targetMs / 1000;
    });
  } catch (e) {}
}

// Measure delay once per second
async function poll() {
  if (!call || !call.peerConnection) return;
  try {
    const stats = await call.peerConnection.getStats();
    let rtt = null, inbound = null;
    stats.forEach(r => {
      if (r.type === 'candidate-pair' && r.nominated && r.state === 'succeeded' && r.currentRoundTripTime != null)
        rtt = r.currentRoundTripTime * 1000;
      if (r.type === 'inbound-rtp' && r.kind === 'audio') inbound = r;
    });

    let buf = null;
    if (inbound && inbound.jitterBufferEmittedCount != null) {
      if (prev) {
        const n = inbound.jitterBufferEmittedCount - prev.c;
        if (n > 0) buf = (inbound.jitterBufferDelay - prev.d) / n * 1000;
      }
      prev = { c: inbound.jitterBufferEmittedCount, d: inbound.jitterBufferDelay };
    }
    const net = rtt != null ? rtt / 2 : null;
    if (net == null && buf == null) return;

    hist.push((net || 0) + (buf || 0) + EXTRA_MS);
    if (hist.length > 3) hist.shift();
    const total = Math.round(hist.reduce((a, b) => a + b, 0) / hist.length);

    const q = latencyQuality(total);
    $('sync-indicator').className = 'audio-indicator active ' + q;
    $('verdict').textContent = q === 'excellent' ? 'Audio is in sync'
      : q === 'good' ? 'Connection is steady' : 'Audio may stutter';
  } catch (e) {}
}

function disconnect() {
  connectionAttempt++;
  clearInterval(timer); timer = null;
  if (peer) peer.destroy();
  peer = null; call = null;
  audio.pause(); audio.srcObject = null;
  if (wake) wake.release().catch(() => {}); wake = null;
  resetStats();
  $('go').disabled = false;
  $('reconnect').hidden = true;
  show('setup'); setSetupStatus('Not connected');
}
$('stop').onclick = disconnect;

function setDelayPreset(ms, persist = true) {
  targetMs = ms;
  if (persist) localStorage.setItem('pcspk-delay-ms', String(ms));
  document.querySelectorAll('.delay-presets button').forEach(button => {
    const active = Number(button.dataset.delay) === ms;
    button.classList.toggle('active', active);
    button.setAttribute('aria-pressed', String(active));
  });
  if (call) lowLatency(call);
}

document.querySelectorAll('.delay-presets button').forEach(button => {
  button.onclick = () => setDelayPreset(Number(button.dataset.delay));
});
setDelayPreset(targetMs, false);

function unlockAudio() {
  audio.src = SILENT; audio.play().catch(() => {});
}

function startListening(code, unlock = true) {
  if (!/^\d{6}$/.test(code)) return setSetupStatus('Enter the 6-digit code from your PC.', 'bad');
  const attempt = ++connectionAttempt;
  localStorage.setItem('code', code);

  if (unlock) unlockAudio();
  keepAwake();
  $('go').disabled = true;

  resetStats();
  $('reconnect').hidden = true;
  setPill('Connecting…'); show('live');
  if (peer) peer.destroy();
  const currentPeer = new Peer();
  peer = currentPeer;

  currentPeer.on('open', () => {
    if (attempt !== connectionAttempt) return;
    const conn = currentPeer.connect('pcspk-' + code, {
      reliable: true,
      metadata: { deviceId, deviceLabel }
    });
    let approvalStatus = 'waiting';
    const showApprovalStatus = status => {
      approvalStatus = status;
      if (status === 'waiting') {
        setPill('Waiting for approval on your PC');
        $('reconnect').hidden = true;
      } else if (status === 'approved') {
        setPill('Connected - waiting for PC audio', 'ok');
        $('reconnect').hidden = true;
      } else {
        setPill('Declined by PC', 'bad');
        $('reconnect').hidden = true;
        if (conn.open) conn.send({ type: 'approval-ack', status: 'declined' });
      }
    };
    conn.on('open', () => {
      if (attempt === connectionAttempt) showApprovalStatus('waiting');
    });
    conn.on('data', message => {
      if (attempt !== connectionAttempt) return;
      if (!message || message.type !== 'approval') return;
      if (!['waiting', 'approved', 'declined'].includes(message.status)) return;
      showApprovalStatus(message.status);
    });
    conn.on('close', () => {
      if (attempt !== connectionAttempt) return;
      if (approvalStatus === 'declined') {
        setPill('Declined by PC', 'bad');
        $('reconnect').hidden = true;
        return;
      }
      setPill('PC disconnected', 'bad'); $('reconnect').hidden = false;
      clearInterval(timer); resetStats();
    });
  });

  currentPeer.on('call', c => {
    if (attempt !== connectionAttempt) { c.close(); return; }
    call = c;
    c.answer(undefined, { sdpTransform: stereo });
    c.on('stream', s => {
      if (attempt !== connectionAttempt) return;
      audio.srcObject = s;
      $('sync-indicator').className = 'audio-indicator active';
      $('verdict').textContent = 'Audio is playing';
      audio.play().then(() => setPill('Connected · playing', 'ok'))
                  .catch(() => setPill('Tap the screen to start', 'bad'));
      $('reconnect').hidden = true;
      lowLatency(c);
      prev = null; clearInterval(timer); timer = setInterval(poll, 1000);
      if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: 'PC audio', artist: 'PC Speaker' });
    });
    c.on('close', () => {
      if (attempt !== connectionAttempt) return;
      setPill('Stream ended', 'bad'); $('reconnect').hidden = false;
      clearInterval(timer); resetStats();
    });
  });

  currentPeer.on('disconnected', () => {
    if (attempt === connectionAttempt) currentPeer.reconnect();
  });
  currentPeer.on('error', e => {
    if (attempt !== connectionAttempt) return;
    disconnect();
    setSetupStatus(e.type === 'peer-unavailable' ? 'Code not found. Is the PC page open?' : 'Error: ' + e.type, 'bad');
  });
}

$('go').onclick = () => startListening($('code').value.trim());
$('reconnect').onclick = () => startListening($('code').value.trim());

$('code').addEventListener('input', () => {
  const code = $('code').value.replace(/\D/g, '').slice(0, 6);
  if ($('code').value !== code) $('code').value = code;
  if (!code) {
    $('code-hint').textContent = '';
  } else if (code.length < 6) {
    $('code-hint').textContent = code.length + ' of 6 digits entered';
  } else {
    $('code-hint').textContent = 'Ready to connect';
  }
});

if (/^\d{6}$/.test(qrCode || '')) startListening(qrCode, false);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
</script></body></html>
